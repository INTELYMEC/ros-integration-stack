version: "3.9"

volumes:
  ros_test_shared:

services:
  robot_p3at_sim_ros1:
    build: ./robot_p3at_sim
    container_name: robot_p3at_sim_ros1
    environment:
      - ROS_MASTER_URI=http://${ROS_MASTER_HOSTNAME}:11311
      - ROS_HOSTNAME=${ROS_MASTER_HOSTNAME}
      - STRATEGY=${STRATEGY}
      - ROBOT_NAMESPACE=${ROBOT_ROS1_NAMESPACE:-p3at_sim_1}
    networks:
      - rosnet

  robot_p3at_sim_ros2:
    build:
      context: ./robot_p3at_sim_ros2
      args:
        - BASE_IMAGE=${ROS2_BASE_IMAGE}
    container_name: robot_p3at_sim_ros2
    hostname: robot_p3at_sim_ros2
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOT_ROS1_NAMESPACE=${ROBOT_ROS1_NAMESPACE:-p3at_sim_1}
      - ROBOT_ROS2_NAMESPACE=${ROBOT_ROS2_NAMESPACE:-p3at_sim_2}
    volumes:
      - ros_test_shared:/ros_test_shared
    networks:
      - rosnet

  ros2_bridge:
    build:
      context: ./ros2_bridge
      args:
        - BASE_IMAGE=${ROS2_BASE_IMAGE}
    container_name: ros2_bridge
    hostname: ros2_bridge
    depends_on:
      - robot_p3at_sim_ros1
      - robot_p3at_sim_ros2
    environment:
      - ROS_MASTER_URI=http://${ROS_MASTER_HOSTNAME}:11311
      - ROS_HOSTNAME=ros2_bridge
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    networks:
      - rosnet

  ros_tests:
    profiles: ["test"]
    build:
      context: ./ros_tests
      args:
        - BASE_IMAGE=${ROS2_BASE_IMAGE}
    depends_on:
      - robot_p3at_sim_ros1
      - robot_p3at_sim_ros2
      - ros2_bridge
    networks:
      - rosnet
    environment:
      - ROS_MASTER_URI=http://${ROS_MASTER_HOSTNAME}:11311
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOT_ROS1_NAMESPACE=${ROBOT_ROS1_NAMESPACE:-p3at_sim_1}
      - ROBOT_ROS2_NAMESPACE=${ROBOT_ROS2_NAMESPACE:-p3at_sim_2}
    volumes:
      - ros_test_shared:/ros_test_shared

networks:
  rosnet:
    driver: bridge
